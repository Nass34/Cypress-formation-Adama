name: Cypress Tests

# Déclencheur : s'exécute sur push et pull request vers main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    # Machine virtuelle fournie par GitHub
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 2 : Installer Node.js
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

          # Étape 3 : Installer les dépendances (npm ci, pas npm install)
      - name: Installer les dépendances
        run: npm ci

        # Étape 4 : Lancer tous les tests Cypress en mode headless
      - name: Lancer les tests Cypress
        run: npx cypress run
        env:
          CI: "true" # Active video: process.env.CI === 'true'

          # Étape 5 : Upload screenshots si échec
      - name: Upload des screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

          # Étape 6 : Upload vidéos (toujours)
      - name: Upload des vidéos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7
